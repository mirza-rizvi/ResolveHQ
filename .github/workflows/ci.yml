name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test (web)
        run: npm run test:web

      - name: Build
        run: npm run build

  # The browser suite is the only gate that drives the real app end to end. It runs as a
  # separate job so a Playwright failure is legible on its own, and because installing a
  # browser costs more than the rest of the pipeline put together.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The dev server reads .dev.vars, which is gitignored, so CI has to create it the
      # same way CONTRIBUTING tells a developer to. Without it SESSION_PEPPER is unset,
      # every auth route answers 503 "Authentication is not configured", and the suite
      # fails at sign-in. The pepper here must stay the one the demo seed's password
      # hashes were derived against.
      - name: Configure the dev server
        run: cp .dev.vars.local.example .dev.vars

      # Resets the local D1, seeds the demo workspace, and starts the dev server itself
      # through playwright.config.ts. No Cloudflare credentials are involved.
      - name: Browser tests
        run: npm run test:e2e

      # Both paths: playwright-report/ is the HTML report, test-results/ holds the
      # screenshot, trace and error context for each failure. Uploading only the former
      # left the first CI failure undiagnosable.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
